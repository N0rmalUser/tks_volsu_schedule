[project]
name = "tks-volsu-schedule"
version = "1.1.0"
description = "Бот, показывающий расписание для студентов, преподавателей и кабинетов кафедры ТКС ВолГУ"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "pydantic>=2.13.5,<2.14",
    "pydantic-settings>=2.16.2",
    "python-dateutil>=3.0.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
]

[dependency-groups]
telegram = [
    "aiogram>=3.31.0",
    "python-docx>=1.2.0",
]

vk = [
    "vkbottle>=4.11.0",
]

scheduler = [
    "apscheduler>=3.10,<4",
    "python-docx>=1.2.0",
]

migrations = [
    "alembic>=1.20.1",
]

dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.3",
    "types-pytz>=2026.5.0.20261006",
]

[tool.uv]
package = false

[tool.ruff]
target-version = 'py314'
line-length = 120
extend-exclude = ["__pycache__", "uv.lock", "alembic"]

[tool.ruff.lint]
select = [
    # Базовые проверки
    "E", "W", "F",

    # Импорты и соглашения об именовании
    "I",
    "ICN",
    "TID",
    "N",

    # Совместимость и современный Python
    "UP",
    "FA",
    "YTT",
    "INT",

    # Корректность и потенциальные ошибки
    "B",
    "A",
    "RET",
    "RSE",
    "SIM",
    "ISC",
    "SLOT",
    "S",

    # Производительность и стиль
    "C4",
    "PERF",
    "FURB",
    "FLY",
    "PIE",

    # Качество кода
    "RUF",
    "PTH",
    "SLF",
    "PL",
    "C90",

    # Асинхронность и работа со временем
    "ASYNC",
    "DTZ",

    # Логирование и отладка
    "LOG",
    "G",
    "T20",
    "ERA",

    # Комментарии и строки
    "COM",
    "Q",

    # Исключения
    "TRY",

    # Прочее
    "T10",   # debugger
    "FAST",  # FastAPI
]

ignore = [
    "COM812",
    "RUF001",
    "RUF002",
    "RUF003",
    "PLR2004",
    "TRY003"
]

[tool.ruff.lint.isort]
known-first-party = ['app']
force-single-line = false
lines-after-imports = 2
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = 'all'

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 'dynamic'

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
