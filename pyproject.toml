[project]
name = "tks-volsu-schedule"
version = "0.1.0"
description = "Бот, показывающий расписание для студентов, преподавателей и кабинетов кафедры ТКС ВолГУ"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiocron>=2.1",
    "aiogram>=3.31.0",
    "alembic>=1.19.1",
    "asyncio>=4.0.0",
    "asyncpg>=0.31.0",
    "lets-plot>= 4.11.0",
    "matplotlib>=3.11.1",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pandas-stubs>=3.0.5.260730",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "pytz>=2026.3",
    "sqlalchemy>=2.0.52",
    "types-pytz>=2026.3.1.20260727",
    "vkbottle>=4.11.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.5.1",
    "ruff==0.15.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = 'py314'
line-length = 120
extend-exclude = ["__pycache__", "uv.lock", "alembic"]

[tool.ruff.lint]
select = [
    # Pycodestyle / Pyflakes

    "E", "W", "F",
    # Imports / naming

    "I", "N",

    # Bugbear / security / correctness
    "B", "A", "SLOT", "RET", "RSE", "SIM", "ISC", "S",

    # Modern Python / typing
    "UP", "FA", "TCH", "YTT", "INT",

    # Comprehensions / performance
    "C4", "PERF", "FURB", "FLY",

    # Code quality
    "PIE", "RUF", "PTH", "SLF", "ASYNC",

    # Logging / comments / formatting
    "ICN", "TID", "COM", "Q", "T10", "T20",
]

ignore = [
    "COM812",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ['app']
force-single-line = false
lines-after-imports = 2
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = 'all'

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 'dynamic'
