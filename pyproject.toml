[project]
name = "tks-volsu-schedule"
version = "0.1.0"
description = "Бот, показывающий расписание для студентов, преподавателей и кабинетов кафедры ТКС ВолГУ"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiocron>=2.1",
    "aiogram>=3.31.0",
    "alembic>=1.19.2",
    "asyncio>=4.0.0",
    "asyncpg>=0.31.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "sqlalchemy>=2.0.52",
    "structlog>=26.1.0",
    "types-pytz>=2026.3.1.20260727",
    "vkbottle>=4.11.0",
]

[dependency-groups]
dev = [
    "pre-commit==4.6.2",
    "ruff==0.16.7",
]

[tool.uv]
package = false

[tool.ruff]
target-version = 'py314'
line-length = 120
extend-exclude = ["__pycache__", "uv.lock", "alembic"]

[tool.ruff.lint]
select = [
    # Базовые проверки
    "E", "W", "F",

    # Импорты и соглашения об именовании
    "I",
    "ICN",
    "TID",
    "N",

    # Совместимость и современный Python
    "UP",
    "FA",
    "YTT",
    "INT",

    # Корректность и потенциальные ошибки
    "B",
    "A",
    "RET",
    "RSE",
    "SIM",
    "ISC",
    "SLOT",
    "S",

    # Производительность и стиль
    "C4",
    "PERF",
    "FURB",
    "FLY",
    "PIE",

    # Качество кода
    "RUF",
    "PTH",
    "SLF",
    "PL",
    "C90",

    # Асинхронность и работа со временем
    "ASYNC",
    "DTZ",

    # Логирование и отладка
    "LOG",
    "G",
    "T20",
    "ERA",

    # Комментарии и строки
    "COM",
    "Q",

    # Исключения
    "TRY",

    # Прочее
    "T10",   # debugger
    "FAST",  # FastAPI
]

ignore = [
    "COM812",
    "RUF001",
    "RUF002",
    "RUF003",
    "PLR2004",
    "TRY003"
]

[tool.ruff.lint.isort]
known-first-party = ['app']
force-single-line = false
lines-after-imports = 2
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = 'all'

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = 'dynamic'

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
