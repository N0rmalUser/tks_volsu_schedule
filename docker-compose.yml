services:
  postgres:
    image: postgres:17
    container_name: schedule_postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schedule_db}
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    build:
      context: .
      target: migrations
    container_name: schedule_migrations
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: .
      target: seed
    container_name: schedule_seed
    env_file: .env
    depends_on:
      migrations:
        condition: service_completed_successfully
    restart: "no"

  schedule_worker:
    build:
      context: .
      target: scheduler
    container_name: schedule_worker
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      migrations:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  tg_bot:
    build:
      context: .
      target: telegram
    container_name: schedule_tg_bot
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      migrations:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  vk_bot:
    build:
      context: .
      target: vk
    container_name: schedule_vk_bot
    env_file: .env
    volumes:
      - ./data:/app/data
    depends_on:
      migrations:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data: